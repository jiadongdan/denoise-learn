[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denoise-learn"
version = "0.1.0"
description = "Deep-learning tools and image-quality metrics for denoising STEM images"
authors = [{ name = "Jiadong Dan", email = "jiadong.dan@u.nus.edu" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = ["denoising", "deep learning", "STEM", "image processing"]
dependencies = [
    "numpy>=1.21",
    "platformdirs",
    "scikit-image",
    "scikit-learn>=1.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
data = [
    "h5py>=3.8",
    "openpyxl>=3.0",
    "pandas>=1.5",
    "scipy>=1.9",
    "tifffile>=2022.0",
]
dev = [
    "h5py>=3.8",
    "matplotlib>=3.5",
    "openpyxl>=3.0",
    "pandas>=1.5",
    "pytest",
    "scipy>=1.9",
    "tifffile>=2022.0",
    "torch>=2.0",
]
examples = ["matplotlib>=3.5", "torch>=2.0"]
inference = ["torch>=2.0"]
noise = [
    "scipy>=1.9",
    "torch>=2.0",
]
notebooks = [
    "ipykernel",
    "jupyterlab",
    "matplotlib>=3.5",
    "pandas",
    "scipy>=1.9",
    "torch>=2.0",
]
torch = ["torch>=2.0"]

[project.scripts]
denoise-learn-provider = "denoiselearn.provider.worker:main"

[project.urls]
Homepage = "https://github.com/jiadongdan/denoise-learn"
Repository = "https://github.com/jiadongdan/denoise-learn"

[tool.setuptools.packages.find]
where = ["."]
include = ["denoiselearn*"]

[tool.setuptools]
license-files = ["licenses/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
